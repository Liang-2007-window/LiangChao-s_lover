<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F6F0E6">
  <title>注册 · 我们的日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <style>html, body { background: #F6F0E6; }</style>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <div class="page-bg" data-page-bg aria-hidden="true"></div>

  <div class="topbar">
    <a class="link-btn" href="index.html">← 回到小站</a>
    <span class="spacer"></span>
    <a class="link-btn" href="index.html">已有账号，去登录</a>
  </div>

  <main class="shell">

    <!-- 第一步：填账号、邮箱、密码 -->
    <section class="card" id="step-form">
      <h1 class="brand">
        <svg viewBox="0 0 32 30" width="18" height="17" aria-hidden="true"><path d="M16,28 C-6,14 4,-4 16,8 C28,-4 38,14 16,28 Z" fill="currentColor"/></svg>
        注册一个小账号
      </h1>
      <p class="lede">
        注册之后这里就是你自己的日记本，别人看不到你写的东西。<br>
        填一个邮箱，我们会发一封验证码邮件过去。
      </p>

      <form id="form" novalidate>
        <div class="field">
          <label for="account">账号名</label>
          <input id="account" name="account" type="text" placeholder="2–32 个字，中英文都行"
                 autocomplete="username" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="32" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" placeholder="用来收验证码、以后找回密码"
                 autocomplete="email" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="254" inputmode="email" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="至少 8 位，要有字母和数字"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="64" enterkeyhint="next">
          <p class="hint">密码只在服务器上校验，数据库里存的是 scrypt 哈希，日记内容也是加密保存的。</p>
        </div>

        <div class="field">
          <label for="password2">再输一次密码</label>
          <input id="password2" name="password2" type="password" placeholder="照上面再打一遍"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="64" enterkeyhint="go">
        </div>

        <button class="btn block" id="send" type="submit">发送验证码</button>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </section>

    <!-- 第二步：收信、填验证码 -->
    <section class="card hidden" id="step-code">
      <h1 class="brand">
        <svg viewBox="0 0 32 30" width="18" height="17" aria-hidden="true"><path d="M16,28 C-6,14 4,-4 16,8 C28,-4 38,14 16,28 Z" fill="currentColor"/></svg>
        查收邮件里那 6 位数字
      </h1>
      <p class="lede">
        验证码已经发到 <strong id="sent-to"></strong>，10 分钟内有效。<br>
        没看到的话翻一下垃圾邮件箱，或者点下面的「重新发送」。
      </p>

      <form id="form-code" novalidate>
        <div class="field">
          <label for="code">验证码</label>
          <div class="code-row">
            <input id="code" name="code" type="text" placeholder="6 位数字" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="\d{6}" enterkeyhint="go">
            <button class="btn ghost small" id="resend" type="button">重新发送</button>
          </div>
        </div>
        <button class="btn block" id="verify" type="submit">验证并进入日记</button>
      </form>
      <p class="msg" id="msg-code" role="status" aria-live="polite"></p>
      <hr class="divider">
      <p class="muted">填错了邮箱？<button class="link-btn" id="back" type="button" style="font-size:13px">回到上一步改一下</button></p>
    </section>

    <p class="foot">
      验证成功会直接登录。<a href="forgot.html">忘记密码？</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
  <script src="js/register.js"></script>
  <script src="js/page-bg.js"></script>
</body>
</html>
