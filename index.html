<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>夏日海岸</title>
  <meta name="description" content="夏日海岸：一道只有你知道答案的小问答。">
  <meta name="theme-color" content="#7FD3F0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="夏日海岸">
  <meta property="og:description" content="一道只有你知道答案的小问答。">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/dogs.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 共用的小图形 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- 云 -->
      <symbol id="cloud" viewBox="0 0 220 100">
        <path fill="#fff" d="M34,90 C8,90 4,60 30,56 C26,30 58,20 76,36 C86,10 130,8 142,34 C160,22 190,36 182,62 C210,62 214,90 186,90 Z"/>
        <path fill="#DCF1FA" d="M34,90 C16,90 8,74 18,66 C22,80 40,82 60,82 L160,82 C176,82 192,80 202,72 C210,84 200,90 186,90 Z"/>
      </symbol>
      <!-- 爪印 -->
      <symbol id="paw" viewBox="0 0 40 40">
        <ellipse cx="20" cy="27" rx="9" ry="7.5"/>
        <ellipse cx="7" cy="17" rx="4" ry="5" transform="rotate(-20 7 17)"/>
        <ellipse cx="15" cy="9" rx="4" ry="5.2" transform="rotate(-6 15 9)"/>
        <ellipse cx="25" cy="9" rx="4" ry="5.2" transform="rotate(6 25 9)"/>
        <ellipse cx="33" cy="17" rx="4" ry="5" transform="rotate(20 33 17)"/>
      </symbol>
      <!-- 闪光 -->
      <symbol id="glint" viewBox="-10 -10 20 20">
        <path d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9 Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- ========== 场景一：夏日海岸 ========== -->
  <div id="scene-summer" class="scene active">

    <!-- 天空 -->
    <div class="sky" aria-hidden="true">
      <div class="sun">
        <svg class="sun-rays" viewBox="-100 -100 200 200">
          <g fill="#FFE27A" opacity=".55">
            <path d="M-6,-98 L0,-66 L6,-98 Z" /><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(30)"/>
            <path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(60)"/><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(90)"/>
            <path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(120)"/><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(150)"/>
            <path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(180)"/><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(210)"/>
            <path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(240)"/><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(270)"/>
            <path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(300)"/><path d="M-6,-98 L0,-66 L6,-98 Z" transform="rotate(330)"/>
          </g>
        </svg>
        <div class="sun-halo"></div>
        <div class="sun-core"></div>
      </div>

      <svg class="cloud cl-1" viewBox="0 0 220 100"><use href="#cloud"/></svg>
      <svg class="cloud cl-2" viewBox="0 0 220 100"><use href="#cloud"/></svg>
      <svg class="cloud cl-3" viewBox="0 0 220 100"><use href="#cloud"/></svg>
      <svg class="cloud cl-4" viewBox="0 0 220 100"><use href="#cloud"/></svg>

      <!-- 海鸥 -->
      <svg class="gull gl-1" viewBox="0 0 60 26"><path d="M4,18 Q16,2 30,14 Q44,2 56,18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="gull gl-2" viewBox="0 0 60 26"><path d="M4,18 Q16,2 30,14 Q44,2 56,18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="gull gl-3" viewBox="0 0 60 26"><path d="M4,18 Q16,2 30,14 Q44,2 56,18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- 远处：山丘、灯塔岛、帆船 -->
    <div class="horizon" aria-hidden="true">
      <svg class="hills hills-l" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path fill="#A9DDDD" d="M0,90 L0,50 C40,20 90,14 140,40 C190,66 250,50 300,62 C340,70 380,80 400,90 Z"/>
        <path fill="#8CCFCF" d="M0,90 L0,64 C50,44 110,48 170,66 C230,84 320,70 400,90 Z"/>
      </svg>
      <svg class="hills hills-r" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path fill="#A9DDDD" d="M0,90 C60,80 120,74 170,60 C230,42 300,12 360,30 C384,38 396,52 400,60 L400,90 Z"/>
        <path fill="#8CCFCF" d="M0,90 C80,86 160,70 230,70 C300,70 350,62 400,74 L400,90 Z"/>
      </svg>

      <!-- 灯塔 -->
      <svg class="lighthouse" viewBox="0 0 130 210">
        <g class="beam"><path d="M64,50 L-70,26 L-70,70 Z" fill="#FFF3A6" opacity=".45"/><path d="M66,50 L200,26 L200,70 Z" fill="#FFF3A6" opacity=".45"/></g>
        <path fill="#7FB59B" d="M4,210 C8,186 28,176 64,176 C100,176 120,186 126,210 Z"/>
        <path fill="#6AA088" d="M30,210 C36,194 52,188 64,188 C86,188 104,196 112,210 Z"/>
        <path fill="#FFFFFF" d="M46,176 L54,66 L76,66 L84,176 Z"/>
        <path fill="#FF7A6B" d="M49,150 L50.6,128 L79.4,128 L81,150 Z"/>
        <path fill="#FF7A6B" d="M52,108 L53.2,90 L76.8,90 L78,108 Z"/>
        <rect x="46" y="60" width="38" height="7" rx="2" fill="#5A6E7F"/>
        <rect x="53" y="44" width="24" height="17" rx="3" fill="#FFE27A"/>
        <path fill="#FF7A6B" d="M49,44 L65,26 L81,44 Z"/>
      </svg>

      <!-- 帆船 -->
      <svg class="boat boat-1" viewBox="0 0 100 100">
        <path fill="#FFFFFF" d="M50,8 L50,66 L16,66 Z"/>
        <path fill="#FFD66B" d="M54,20 L54,66 L86,66 Z"/>
        <path fill="#FF7A6B" d="M8,70 L92,70 L80,90 L20,90 Z"/>
        <path fill="#FF7A6B" d="M50,8 L62,12 L50,16 Z"/>
      </svg>
      <svg class="boat boat-2" viewBox="0 0 100 100">
        <path fill="#FFFFFF" d="M48,10 L48,66 L18,66 Z"/>
        <path fill="#A8E3EE" d="M52,24 L52,66 L80,66 Z"/>
        <path fill="#FFFFFF" d="M8,70 L92,70 L80,90 L20,90 Z"/>
        <path fill="#2FA8C4" d="M10,74 L90,74 L88,78 L12,78 Z"/>
      </svg>
    </div>

    <!-- 海 -->
    <div class="sea" aria-hidden="true">
      <div class="swell swell-1"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,20 Q25,2 50,20 T100,20 T150,20 T200,20 T250,20 T300,20 T350,20 T400,20 T450,20 T500,20 T550,20 T600,20 T650,20 T700,20 T750,20 T800,20" /></svg></div>
      <div class="swell swell-2"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,20 Q25,2 50,20 T100,20 T150,20 T200,20 T250,20 T300,20 T350,20 T400,20 T450,20 T500,20 T550,20 T600,20 T650,20 T700,20 T750,20 T800,20" /></svg></div>
      <div class="swell swell-3"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,20 Q25,2 50,20 T100,20 T150,20 T200,20 T250,20 T300,20 T350,20 T400,20 T450,20 T500,20 T550,20 T600,20 T650,20 T700,20 T750,20 T800,20" /></svg></div>
      <div class="swell swell-4"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,20 Q25,2 50,20 T100,20 T150,20 T200,20 T250,20 T300,20 T350,20 T400,20 T450,20 T500,20 T550,20 T600,20 T650,20 T700,20 T750,20 T800,20" /></svg></div>
      <svg class="glint g1"><use href="#glint"/></svg><svg class="glint g2"><use href="#glint"/></svg>
      <svg class="glint g3"><use href="#glint"/></svg><svg class="glint g4"><use href="#glint"/></svg>
      <svg class="glint g5"><use href="#glint"/></svg><svg class="glint g6"><use href="#glint"/></svg>
      <svg class="glint g7"><use href="#glint"/></svg><svg class="glint g8"><use href="#glint"/></svg>

      <!-- 浮标 -->
      <svg class="buoy" viewBox="0 0 40 60">
        <ellipse cx="20" cy="54" rx="16" ry="4" fill="#1F8FAE" opacity=".5"/>
        <path d="M10,52 L12,30 L28,30 L30,52 Z" fill="#FF7A6B"/>
        <path d="M11,42 L11.6,36 L28.4,36 L29,42 Z" fill="#fff"/>
        <path d="M20,30 L20,10" stroke="#5A6E7F" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="8" r="4.5" fill="#FFE27A"/>
      </svg>
    </div>

    <!-- 海浪泡沫 -->
    <div class="foam" aria-hidden="true">
      <div class="foam-line foam-a"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,40 L0,18 Q25,2 50,18 T100,18 T150,18 T200,18 T250,18 T300,18 T350,18 T400,18 T450,18 T500,18 T550,18 T600,18 T650,18 T700,18 T750,18 T800,18 L800,40 Z"/></svg></div>
      <div class="foam-line foam-b"><svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0,40 L0,18 Q25,2 50,18 T100,18 T150,18 T200,18 T250,18 T300,18 T350,18 T400,18 T450,18 T500,18 T550,18 T600,18 T650,18 T700,18 T750,18 T800,18 L800,40 Z"/></svg></div>
    </div>

    <!-- 沙滩 -->
    <div class="beach" aria-hidden="true">
      <div class="wet"></div>

      <!-- 爪印：从海边一路走到沙滩 -->
      <div class="prints">
        <svg class="pw pw1"><use href="#paw"/></svg><svg class="pw pw2"><use href="#paw"/></svg>
        <svg class="pw pw3"><use href="#paw"/></svg><svg class="pw pw4"><use href="#paw"/></svg>
        <svg class="pw pw5"><use href="#paw"/></svg><svg class="pw pw6"><use href="#paw"/></svg>
        <svg class="pw pw7"><use href="#paw"/></svg><svg class="pw pw8"><use href="#paw"/></svg>
      </div>

      <!-- 左：沙滩伞 + 戴墨镜的小黑狗 -->
      <div class="spot spot-umbrella">
        <svg class="towel" viewBox="0 0 230 50">
          <path d="M18,6 L212,6 L230,44 L0,44 Z" fill="#FFFDF4" stroke="#6A4030" stroke-width="3" stroke-linejoin="round"/>
          <path d="M20,14 L210,14 L214,22 L16,22 Z" fill="#2FB8C6"/>
          <path d="M10,30 L220,30 L224,38 L6,38 Z" fill="#FF7A6B"/>
        </svg>
        <svg class="umbrella" viewBox="0 0 220 230">
          <path d="M112,40 L120,226" stroke="#6A4030" stroke-width="6" stroke-linecap="round"/>
          <path fill="#FF7A6B" stroke="#6A4030" stroke-width="3.4" stroke-linejoin="round" d="M8,100 C8,46 58,10 110,10 C162,10 212,46 212,100 Q190,114 170,100 Q150,114 130,100 Q110,114 90,100 Q70,114 50,100 Q30,114 8,100 Z"/>
          <path fill="#FFFFFF" d="M110,10 C80,28 62,60 50,100 Q70,112 90,100 C98,64 104,36 110,10 Z"/>
          <path fill="#FFFFFF" d="M110,10 C140,28 158,60 170,100 Q150,112 130,100 C122,64 116,36 110,10 Z"/>
          <path fill="none" stroke="#6A4030" stroke-width="3" stroke-linejoin="round" d="M110,10 C80,28 62,60 50,100 M110,10 C98,40 94,70 90,100 M110,10 C122,40 126,70 130,100 M110,10 C140,28 158,60 170,100"/>
          <circle cx="110" cy="9" r="6" fill="#FFD66B" stroke="#6A4030" stroke-width="3"/>
        </svg>
        <div class="dog-slot dog-cool"></div>
        <svg class="flipflops" viewBox="0 0 90 40">
          <g fill="#FFD66B" stroke="#6A4030" stroke-width="2.8" stroke-linejoin="round">
            <path d="M6,26 C2,10 14,4 22,10 C30,16 28,36 16,36 C10,36 7,32 6,26 Z"/>
            <path d="M52,24 C48,8 60,2 68,8 C76,14 74,34 62,34 C56,34 53,30 52,24 Z"/>
          </g>
          <path d="M14,12 L18,22 M60,10 L64,20" stroke="#FF7A6B" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- 中：沙堡 + 小桶 -->
      <div class="spot spot-castle">
        <svg class="castle" viewBox="0 0 170 160">
          <g stroke="#B58545" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <path d="M54,28 L54,16 L64,16 L64,22 L74,22 L74,16 L84,16 L84,22 L94,22 L94,16 L104,16 L104,28 L108,138 L50,138 Z" fill="#F4D391"/>
            <path d="M12,60 L12,50 L20,50 L20,55 L28,55 L28,50 L36,50 L36,55 L44,55 L44,50 L50,50 L50,138 L8,138 Z" fill="#EFC77F"/>
            <path d="M120,60 L120,50 L126,50 L126,55 L134,55 L134,50 L142,50 L142,55 L150,55 L150,50 L158,50 L158,60 L162,138 L120,138 Z" fill="#EFC77F"/>
            <path d="M50,92 L120,92 L124,138 L46,138 Z" fill="#F7DBA3"/>
            <path d="M70,138 L70,114 Q85,98 100,114 L100,138 Z" fill="#9A6B34"/>
          </g>
          <path d="M30,80 L30,92 M138,80 L138,92 M79,58 L79,70" stroke="#9A6B34" stroke-width="5" stroke-linecap="round"/>
          <path d="M79,16 L79,-4" stroke="#6A4030" stroke-width="3" stroke-linecap="round" transform="translate(2,14)"/>
          <path d="M81,10 L101,17 L81,24 Z" fill="#FF7A6B" stroke="#6A4030" stroke-width="2.6" stroke-linejoin="round" class="flag"/>
        </svg>
        <svg class="bucket" viewBox="0 0 70 80">
          <path d="M12,34 Q35,-6 58,34" fill="none" stroke="#6A4030" stroke-width="3" stroke-linecap="round"/>
          <path d="M8,34 L62,34 L54,76 L16,76 Z" fill="#2FB8C6" stroke="#6A4030" stroke-width="3" stroke-linejoin="round"/>
          <path d="M12,48 L58,48" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
        </svg>
        <svg class="shell shell-1" viewBox="0 0 44 36">
          <path d="M3,30 C-2,6 42,6 41,30 Z" fill="#FFC4CF" stroke="#6A4030" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M22,30 L22,10 M13,30 L9,13 M31,30 L35,13" stroke="#6A4030" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- 螃蟹 -->
      <div class="crab-track">
        <div class="crab">
          <svg viewBox="0 0 110 80">
            <g stroke="#6A4030" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <g class="legs" fill="none">
                <path d="M30,54 L12,60 M30,60 L16,72 M80,54 L98,60 M80,60 L94,72"/>
              </g>
              <path d="M30,44 C12,40 8,18 22,14 C30,12 32,22 30,28 C36,26 38,34 30,44 Z" fill="#FF7A6B" class="claw claw-l"/>
              <path d="M80,44 C98,40 102,18 88,14 C80,12 78,22 80,28 C74,26 72,34 80,44 Z" fill="#FF7A6B" class="claw claw-r"/>
              <ellipse cx="55" cy="52" rx="30" ry="20" fill="#FF8A74"/>
              <path d="M44,34 L44,26 M66,34 L66,26" fill="none"/>
            </g>
            <circle cx="44" cy="22" r="7.5" fill="#fff" stroke="#6A4030" stroke-width="2.6"/><circle cx="66" cy="22" r="7.5" fill="#fff" stroke="#6A4030" stroke-width="2.6"/>
            <circle cx="45" cy="23" r="3.4" fill="#3A2318"/><circle cx="65" cy="23" r="3.4" fill="#3A2318"/>
            <path d="M49,54 Q55,60 61,54" fill="none" stroke="#3A2318" stroke-width="2.8" stroke-linecap="round"/>
            <ellipse cx="38" cy="53" rx="5" ry="3" fill="#FF5E7A" opacity=".5"/><ellipse cx="72" cy="53" rx="5" ry="3" fill="#FF5E7A" opacity=".5"/>
          </svg>
        </div>
      </div>

      <svg class="starfish" viewBox="0 0 60 60">
        <path d="M30,6 L36.6,22.6 L54.4,23.4 L40.6,34.6 L45.4,51.8 L30,42 L14.6,51.8 L19.4,34.6 L5.6,23.4 L23.4,22.6 Z" fill="#FFA45C" stroke="#6A4030" stroke-width="3.2" stroke-linejoin="round"/>
        <g fill="#FFE0B8"><circle cx="30" cy="20" r="2"/><circle cx="30" cy="30" r="2.2"/><circle cx="42" cy="26" r="1.8"/><circle cx="18" cy="26" r="1.8"/><circle cx="36" cy="40" r="1.8"/><circle cx="24" cy="40" r="1.8"/></g>
      </svg>

      <!-- 右：冲浪板 + 沙滩球 + 戴花的小狗 -->
      <div class="spot spot-right">
        <svg class="surfboard" viewBox="0 0 70 230">
          <path d="M35,6 C58,36 62,150 52,214 Q35,226 18,214 C8,150 12,36 35,6 Z" fill="#7FE0E6" stroke="#6A4030" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M35,10 L35,214" stroke="#6A4030" stroke-width="2.6" opacity=".35"/>
          <path d="M16,92 C28,98 42,98 54,92 L55,112 C42,118 28,118 15,112 Z" fill="#FF7A6B"/>
          <path d="M16,126 C28,132 42,132 54,126 L54,138 C42,144 28,144 16,138 Z" fill="#fff"/>
        </svg>
        <div class="dog-slot dog-flower"></div>
        <svg class="ball" viewBox="-2 -2 64 64">
          <g stroke="#6A4030" stroke-width="2.6" stroke-linejoin="round">
            <path d="M30,30 L30,0 A30,30 0 0 1 56,15 Z" fill="#FF7A6B"/><path d="M30,30 L56,15 A30,30 0 0 1 56,45 Z" fill="#FFFFFF"/>
            <path d="M30,30 L56,45 A30,30 0 0 1 30,60 Z" fill="#FFD66B"/><path d="M30,30 L30,60 A30,30 0 0 1 4,45 Z" fill="#2FB8C6"/>
            <path d="M30,30 L4,45 A30,30 0 0 1 4,15 Z" fill="#FFFFFF"/><path d="M30,30 L4,15 A30,30 0 0 1 30,0 Z" fill="#FFD66B"/>
          </g>
          <path d="M14,10 Q22,4 32,5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".7"/>
        </svg>
      </div>

      <!-- 椰子树 -->
      <svg class="palm" viewBox="0 0 300 440">
        <g class="palm-sway">
          <path d="M120,440 C130,340 150,240 188,120" fill="none" stroke="#6A4030" stroke-width="34" stroke-linecap="round"/>
          <path d="M120,440 C130,340 150,240 188,120" fill="none" stroke="#B98253" stroke-width="26" stroke-linecap="round"/>
          <path d="M126,400 L146,394 M130,360 L152,352 M138,316 L160,306 M146,272 L168,262 M158,226 L178,214 M170,180 L190,168" stroke="#8A5A36" stroke-width="3.4" stroke-linecap="round" opacity=".6"/>
          <g transform="translate(188,118)">
            <g class="fronds" stroke="#2F6B4A" stroke-width="3.2" stroke-linejoin="round">
              <path d="M0,0 C-30,-60 -110,-70 -160,-20 C-120,-34 -60,-24 0,0 Z" fill="#46B07A"/>
              <path d="M0,0 C30,-62 110,-74 164,-26 C122,-36 60,-24 0,0 Z" fill="#46B07A"/>
              <path d="M0,0 C-50,-20 -110,10 -128,70 C-96,28 -50,14 0,0 Z" fill="#3A9A68"/>
              <path d="M0,0 C50,-20 112,10 134,70 C100,28 52,14 0,0 Z" fill="#3A9A68"/>
              <path d="M0,0 C-14,-50 -4,-100 40,-124 C30,-80 20,-40 0,0 Z" fill="#58C48A"/>
              <path d="M0,0 C-10,34 -50,64 -90,64 C-60,40 -30,22 0,0 Z" fill="#58C48A"/>
              <path d="M0,0 C10,34 50,64 94,60 C62,38 30,22 0,0 Z" fill="#58C48A"/>
            </g>
            <g fill="#8A5A36" stroke="#6A4030" stroke-width="3"><circle cx="-8" cy="14" r="11"/><circle cx="12" cy="16" r="11"/><circle cx="2" cy="28" r="10"/></g>
          </g>
        </g>
      </svg>

      <!-- 小贝壳等点缀 -->
      <svg class="shell shell-2" viewBox="0 0 44 36">
        <path d="M3,30 C-2,6 42,6 41,30 Z" fill="#FFE0B8" stroke="#6A4030" stroke-width="2.8" stroke-linejoin="round"/>
        <path d="M22,30 L22,10 M13,30 L9,13 M31,30 L35,13" stroke="#6A4030" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 近景：海边的草和小花 -->
    <div class="fg" aria-hidden="true">
      <svg class="grass grass-l" viewBox="0 0 160 150">
        <g stroke="#2F6B4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M80,150 C70,100 40,60 12,36 C46,52 74,84 84,150 Z" fill="#46B07A"/>
          <path d="M80,150 C84,90 92,40 100,6 C112,50 104,100 96,150 Z" fill="#58C48A"/>
          <path d="M84,150 C96,110 120,76 154,58 C130,88 112,116 104,150 Z" fill="#3A9A68"/>
          <path d="M70,150 C54,120 34,104 6,100 C34,110 56,126 76,150 Z" fill="#3A9A68"/>
        </g>
        <g><circle cx="102" cy="8" r="9" fill="#FFB6C8" stroke="#6A4030" stroke-width="2.6"/><circle cx="102" cy="8" r="3.6" fill="#FFE27A"/>
           <circle cx="14" cy="38" r="7.5" fill="#FFFFFF" stroke="#6A4030" stroke-width="2.6"/><circle cx="14" cy="38" r="3" fill="#FFE27A"/></g>
      </svg>
      <svg class="grass grass-r" viewBox="0 0 160 150">
        <g stroke="#2F6B4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M80,150 C90,100 120,60 148,36 C114,52 86,84 76,150 Z" fill="#46B07A"/>
          <path d="M80,150 C76,90 68,40 60,6 C48,50 56,100 64,150 Z" fill="#58C48A"/>
          <path d="M76,150 C64,110 40,76 6,58 C30,88 48,116 56,150 Z" fill="#3A9A68"/>
          <path d="M90,150 C106,120 126,104 154,100 C126,110 104,126 84,150 Z" fill="#3A9A68"/>
        </g>
        <g><circle cx="58" cy="8" r="9" fill="#FFFFFF" stroke="#6A4030" stroke-width="2.6"/><circle cx="58" cy="8" r="3.6" fill="#FFE27A"/>
           <circle cx="146" cy="38" r="7.5" fill="#FFB6C8" stroke="#6A4030" stroke-width="2.6"/><circle cx="146" cy="38" r="3" fill="#FFE27A"/></g>
      </svg>
    </div>

    <!-- 问题明信片 -->
    <div class="card-wrap">
      <div class="peek-slot" id="peek-slot"></div>
      <p id="hint-text" class="hint-text" role="status" aria-live="polite"></p>
      <div class="question-card">
        <span class="tape tape-l"></span><span class="tape tape-r"></span>
        <div class="card-inner">
          <h1 class="question-title">青春の问答</h1>
          <p class="question-text">梁超最喜欢的人是谁？</p>
          <div class="input-group">
            <input type="text" id="answer-input" class="answer-input" placeholder="输入你的答案…" maxlength="10" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="你的答案">
            <button id="submit-btn" class="submit-btn" type="button">确认答案</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 场景二：黄昏单车骑行 ========== -->
  <div id="scene-sunset" class="scene idle">
    <div class="photo" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="drift" id="drift" aria-hidden="true"></div>

    <!-- 贴纸小狗 -->
    <div class="sticker st-1" id="st-1" aria-hidden="true"></div>
    <div class="sticker st-2" id="st-2" aria-hidden="true"></div>
    <div class="sticker st-3" id="st-3" aria-hidden="true"></div>
    <div class="sticker st-4" id="st-4" aria-hidden="true"></div>

    <!-- 骑车 -->
    <div class="ride" aria-hidden="true">
      <div class="ground" id="ground"></div>
      <div class="bike-rig sticker-edge">
        <svg class="bike bike-back" viewBox="0 0 320 200">
          <g class="wheel wheel-r">
            <circle cx="72" cy="140" r="50" fill="none" stroke="#4A3128" stroke-width="7"/>
            <g stroke="#4A3128" stroke-width="2" opacity=".7"><path d="M72,92 L72,188 M24,140 L120,140 M38,106 L106,174 M106,106 L38,174"/></g>
            <circle cx="72" cy="140" r="6" fill="#FFD66B" stroke="#4A3128" stroke-width="3"/>
          </g>
          <g class="wheel wheel-f">
            <circle cx="250" cy="140" r="50" fill="none" stroke="#4A3128" stroke-width="7"/>
            <g stroke="#4A3128" stroke-width="2" opacity=".7"><path d="M250,92 L250,188 M202,140 L298,140 M216,106 L284,174 M284,106 L216,174"/></g>
            <circle cx="250" cy="140" r="6" fill="#FFD66B" stroke="#4A3128" stroke-width="3"/>
          </g>
          <g fill="none" stroke="#FF7A6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M72,140 L146,142 L128,84 L72,140"/>
            <path d="M128,84 L226,84 L146,142"/>
            <path d="M226,84 L250,140"/>
            <path d="M226,84 L220,56"/>
          </g>
          <path d="M206,52 Q222,46 238,52" fill="none" stroke="#4A3128" stroke-width="7" stroke-linecap="round"/>
          <path d="M104,72 Q126,66 148,72 L146,80 Q126,86 104,80 Z" fill="#4A3128" stroke="#4A3128" stroke-width="4" stroke-linejoin="round"/>
          <path d="M128,84 L126,74" stroke="#4A3128" stroke-width="6" stroke-linecap="round"/>
          <circle cx="146" cy="142" r="9" fill="#FFD66B" stroke="#4A3128" stroke-width="4"/>
          <path d="M146,142 L136,160 M146,142 L156,124" stroke="#4A3128" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="bike-dog" id="bike-dog"></div>
        <svg class="bike bike-front" viewBox="0 0 320 200">
          <!-- 车筐前半部分（盖住小狗的身体） -->
          <path d="M214,62 L290,62 L282,104 Q278,114 268,114 L232,114 Q222,114 220,104 Z" fill="#E9B97A" stroke="#4A3128" stroke-width="4" stroke-linejoin="round"/>
          <path d="M222,76 L282,76 M224,90 L280,90 M240,64 L238,112 M256,64 L256,112 M272,64 L274,112" stroke="#B98253" stroke-width="3" stroke-linecap="round" opacity=".9"/>
          <path d="M210,62 L294,62" stroke="#4A3128" stroke-width="6" stroke-linecap="round"/>
          <!-- 围巾 -->
          <path class="scarf-tail" d="M214,56 Q190,50 170,62 Q186,66 200,74 Q206,66 214,56 Z" fill="#FF7A6B" stroke="#4A3128" stroke-width="3.4" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="love-container" id="love-container">
      <div class="love-text" id="love-text" aria-label="我爱你">
        <span class="char char-1">我</span><span class="char char-2">爱</span><span class="char char-3">你</span>
      </div>
    </div>

    <div class="hearts-area" id="hearts-area" aria-hidden="true"></div>

    <!-- 登录入口：「我爱你」出现之后淡入，通往日记页 -->
    <section class="login" id="login" aria-labelledby="login-title">
      <p class="login-title" id="login-title">我们的日记</p>
      <form class="login-form" id="login-form" autocomplete="on" novalidate>
        <div class="login-field">
          <input class="login-input" id="login-user" name="username" type="text" placeholder="账号" aria-label="账号" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="32">
        </div>
        <div class="login-field">
          <input class="login-input has-eye" id="login-pass" name="password" type="password" placeholder="密码" aria-label="密码" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="64">
          <button class="login-eye" id="login-eye" type="button" aria-label="显示密码" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3.5 3.5l17 17"/></svg>
          </button>
        </div>
        <button class="login-btn" id="login-btn" type="submit">
          <span>进入</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
      <p class="login-alt">
        <a href="register.html">注册</a>
        <span aria-hidden="true">·</span>
        <a href="forgot.html">忘记密码</a>
      </p>
    </section>

    <button type="button" class="music-info" id="music-info" aria-label="暂停音乐" disabled>
      <span class="eq" id="music-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="music-label">正在播放...</span>
    </button>

    <audio id="bgm" loop preload="none">
      <source src="audio/bgm.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="js/dogs.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
