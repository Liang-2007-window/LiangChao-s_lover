<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏日海岸</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== 场景一：夏日沿海（写实风格） ========== -->
  <div id="scene-summer" class="scene active">

    <!-- 写实天空 -->
    <div class="real-sky">
      <!-- 太阳光晕 -->
      <div class="sun-glow-area">
        <div class="sun-core"></div>
        <div class="sun-corona corona-1"></div>
        <div class="sun-corona corona-2"></div>
        <div class="sun-corona corona-3"></div>
      </div>
      <!-- 太阳光线 -->
      <div class="sun-rays"></div>

      <!-- 积云 -->
      <div class="cumulus cumulus-1">
        <div class="cu-bump cu-b1"></div><div class="cu-bump cu-b2"></div>
        <div class="cu-bump cu-b3"></div><div class="cu-bump cu-b4"></div>
        <div class="cu-bump cu-b5"></div><div class="cu-bump cu-b6"></div>
      </div>
      <div class="cumulus cumulus-2">
        <div class="cu-bump cu-b1"></div><div class="cu-bump cu-b2"></div>
        <div class="cu-bump cu-b3"></div><div class="cu-bump cu-b4"></div>
      </div>
      <div class="cumulus cumulus-3">
        <div class="cu-bump cu-b1"></div><div class="cu-bump cu-b2"></div>
        <div class="cu-bump cu-b3"></div><div class="cu-bump cu-b4"></div>
        <div class="cu-bump cu-b5"></div>
      </div>
      <!-- 高积云 -->
      <div class="altocumulus alto-1"></div>
      <div class="altocumulus alto-2"></div>
    </div>

    <!-- 海鸥群 -->
    <div class="seagull-group">
      <svg class="sg sg-1" viewBox="0 0 60 20"><path d="M5,15 Q15,2 30,10 Q45,2 55,15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
      <svg class="sg sg-2" viewBox="0 0 50 18"><path d="M4,13 Q12,2 25,8 Q38,2 46,13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="sg sg-3" viewBox="0 0 55 18"><path d="M4,14 Q14,3 27,9 Q40,3 51,14" fill="none" stroke="#f0f0f0" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="sg sg-4" viewBox="0 0 45 16"><path d="M3,12 Q10,2 22,7 Q34,2 42,12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>

    <!-- 远海地平线 -->
    <div class="horizon">
      <div class="distant-island"></div>
      <div class="distant-island-small"></div>
    </div>

    <!-- 写实海洋 -->
    <div class="real-ocean">
      <!-- 深海层 -->
      <div class="ocean-deep-layer"></div>
      <!-- 波浪面 -->
      <svg class="ocean-wave ow-1" viewBox="0 0 1440 80" preserveAspectRatio="none">
        <path d="M0,35 C120,55 240,15 360,40 C480,65 600,20 720,38 C840,56 960,18 1080,42 C1200,66 1320,22 1440,36 L1440,80 L0,80 Z" fill="rgba(27,132,172,0.75)"/>
      </svg>
      <svg class="ocean-wave ow-2" viewBox="0 0 1440 90" preserveAspectRatio="none">
        <path d="M0,30 C100,10 200,55 360,35 C520,15 660,50 800,32 C940,14 1080,48 1200,30 C1320,12 1400,50 1440,28 L1440,90 L0,90 Z" fill="rgba(39,160,200,0.65)"/>
      </svg>
      <svg class="ocean-wave ow-3" viewBox="0 0 1440 100" preserveAspectRatio="none">
        <path d="M0,40 C180,60 300,15 480,45 C660,75 780,25 960,48 C1140,71 1260,20 1440,42 L1440,100 L0,100 Z" fill="rgba(58,180,220,0.55)"/>
      </svg>
      <svg class="ocean-wave ow-4" viewBox="0 0 1440 80" preserveAspectRatio="none">
        <path d="M0,25 C150,5 280,40 440,28 C600,16 720,45 880,30 C1040,15 1180,42 1440,22 L1440,80 L0,80 Z" fill="rgba(82,200,235,0.45)"/>
      </svg>
      <!-- 海面日光反射 -->
      <div class="sun-reflection"></div>
      <div class="sun-reflection-sub"></div>
      <!-- 碎浪泡沫 -->
      <div class="whitecap wc-1"></div>
      <div class="whitecap wc-2"></div>
      <div class="whitecap wc-3"></div>
    </div>

    <!-- 岸边岩石 -->
    <div class="rocky-outcrop">
      <div class="rock rock-main"></div>
      <div class="rock rock-small"></div>
      <div class="rock rock-tiny"></div>
    </div>

    <!-- 写实沙滩 -->
    <div class="real-beach">
      <!-- 湿沙区 -->
      <div class="wet-sand">
        <div class="foam-edge"></div>
        <div class="receding-foam"></div>
      </div>
      <!-- 干沙区 -->
      <div class="dry-sand">
        <div class="sand-grain"></div>
        <!-- 沙纹 -->
        <div class="sand-ripple sr-1"></div>
        <div class="sand-ripple sr-2"></div>
        <div class="sand-ripple sr-3"></div>
      </div>
    </div>

    <!-- 沙滩细节 -->
    <div class="beach-details">
      <div class="pebble pebble-1"></div>
      <div class="pebble pebble-2"></div>
      <div class="pebble pebble-3"></div>
      <div class="seashell-real sh-1"></div>
      <div class="seashell-real sh-2"></div>
      <div class="driftwood"></div>
    </div>

    <!-- 海边植被 -->
    <div class="coastal-plants">
      <div class="beach-grass bg-left">
        <div class="grass-blade"></div><div class="grass-blade"></div>
        <div class="grass-blade"></div><div class="grass-blade"></div>
        <div class="grass-blade"></div>
      </div>
      <div class="beach-grass bg-right">
        <div class="grass-blade"></div><div class="grass-blade"></div>
        <div class="grass-blade"></div><div class="grass-blade"></div>
      </div>
    </div>

    <!-- 问题卡片（海滩风格） -->
    <div class="question-card">
      <div class="card-inner">
        <h1 class="question-title">🌊  青春の问答  🌊</h1>
        <p class="question-text">梁超最喜欢的人是谁？</p>
        <div class="input-group">
          <input type="text" id="answer-input" class="answer-input" placeholder="输入你的答案..." maxlength="10" autocomplete="off">
          <button id="submit-btn" class="submit-btn">确认答案</button>
        </div>
        <p id="hint-text" class="hint-text"></p>
      </div>
    </div>
  </div>

  <!-- ========== 场景二：黄昏单车骑行 ========== -->
  <div id="scene-sunset" class="scene">

    <!-- 照片背景 -->
    <div class="photo-bg"></div>

    <!-- 照片上方渐变遮罩（让文字更清晰） -->
    <div class="photo-overlay"></div>

    <!-- 星星 -->
    <div class="stars-container" id="stars-container"></div>

    <!-- 沿海公路 (叠加在照片之上) -->
    <div class="coastal-road">
      <div class="road-surface">
        <div class="road-line"></div>
        <div class="road-line"></div>
      </div>
      <div class="road-edge road-edge-left"></div>
      <div class="road-edge road-edge-right"></div>
      <div class="guardrail">
        <div class="guardrail-post" style="left:5%"></div>
        <div class="guardrail-post" style="left:15%"></div>
        <div class="guardrail-post" style="left:25%"></div>
        <div class="guardrail-post" style="left:35%"></div>
        <div class="guardrail-post" style="left:45%"></div>
        <div class="guardrail-post" style="left:55%"></div>
        <div class="guardrail-post" style="left:65%"></div>
        <div class="guardrail-post" style="left:75%"></div>
        <div class="guardrail-post" style="left:85%"></div>
        <div class="guardrail-post" style="left:95%"></div>
      </div>
    </div>

    <!-- 路边树木 -->
    <div class="roadside-trees">
      <div class="tree tree-1"></div>
      <div class="tree tree-2"></div>
      <div class="tree tree-3"></div>
    </div>

    <!-- 单车 -->
    <div class="bicycle-container">
      <div class="bicycle">
        <svg viewBox="0 0 200 140" class="bike-svg">
          <circle cx="50" cy="100" r="30" fill="none" stroke="#5c3d2e" stroke-width="3"/>
          <circle cx="50" cy="100" r="2" fill="#5c3d2e"/>
          <line x1="50" y1="100" x2="80" y2="100" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="50" y1="100" x2="50" y2="70" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="50" y1="100" x2="20" y2="100" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="50" y1="100" x2="50" y2="130" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <circle cx="150" cy="100" r="30" fill="none" stroke="#5c3d2e" stroke-width="3"/>
          <circle cx="150" cy="100" r="2" fill="#5c3d2e"/>
          <line x1="150" y1="100" x2="180" y2="100" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="150" y1="100" x2="150" y2="70" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="150" y1="100" x2="120" y2="100" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="150" y1="100" x2="150" y2="130" stroke="#5c3d2e" stroke-width="0.8" opacity="0.5"/>
          <line x1="70" y1="85" x2="130" y2="85" stroke="#e8734a" stroke-width="4" stroke-linecap="round"/>
          <line x1="50" y1="100" x2="70" y2="85" stroke="#e8734a" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="70" y1="85" x2="50" y2="70" stroke="#e8734a" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="130" y1="85" x2="150" y2="100" stroke="#e8734a" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="100" y1="85" x2="120" y2="70" stroke="#e8734a" stroke-width="3" stroke-linecap="round"/>
          <line x1="70" y1="85" x2="100" y2="85" stroke="#e8734a" stroke-width="3" stroke-linecap="round"/>
          <line x1="120" y1="70" x2="135" y2="62" stroke="#5c3d2e" stroke-width="3" stroke-linecap="round"/>
          <line x1="128" y1="65" x2="140" y2="60" stroke="#5c3d2e" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="45" y1="70" x2="60" y2="70" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round"/>
          <circle cx="100" cy="92" r="4" fill="#5c3d2e"/>
          <line x1="100" y1="92" x2="95" y2="100" stroke="#5c3d2e" stroke-width="2"/>
          <line x1="100" y1="92" x2="105" y2="84" stroke="#5c3d2e" stroke-width="2"/>
        </svg>
      </div>
      <div class="bike-shadow"></div>
    </div>

    <!-- 线条小狗装饰 -->
    <div class="line-dogs">
      <!-- 小狗1: 左下角坐着的小狗 -->
      <svg class="line-dog ld-1" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- 身体 -->
          <ellipse cx="50" cy="95" rx="22" ry="18"/>
          <!-- 头 -->
          <circle cx="50" cy="60" r="20"/>
          <!-- 耳朵左 -->
          <path d="M33,52 Q24,30 36,40 Q34,48 38,52"/>
          <!-- 耳朵右 -->
          <path d="M67,52 Q76,30 64,40 Q66,48 62,52"/>
          <!-- 眼睛 -->
          <circle cx="43" cy="56" r="2.5" fill="#5c4033"/>
          <circle cx="57" cy="56" r="2.5" fill="#5c4033"/>
          <!-- 鼻子 -->
          <ellipse cx="50" cy="64" rx="3.5" ry="2.5" fill="#5c4033"/>
          <!-- 嘴 -->
          <path d="M46,68 Q50,73 54,68"/>
          <!-- 腮红 -->
          <circle cx="38" cy="63" r="3.5" fill="#ffb3b3" stroke="none" opacity="0.6"/>
          <circle cx="62" cy="63" r="3.5" fill="#ffb3b3" stroke="none" opacity="0.6"/>
          <!-- 前腿 -->
          <path d="M36,108 Q34,125 30,130"/>
          <path d="M48,110 Q46,125 44,130"/>
          <!-- 后腿 -->
          <path d="M58,108 Q60,122 62,128"/>
          <path d="M68,105 Q72,120 76,125"/>
          <!-- 尾巴 -->
          <path d="M28,90 Q12,80 15,68 Q18,58 25,65" stroke-width="2"/>
        </g>
      </svg>

      <!-- 小狗2: 右上角举爱心的小狗 -->
      <svg class="line-dog ld-2" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- 身体 -->
          <ellipse cx="55" cy="95" rx="20" ry="17"/>
          <!-- 头 -->
          <circle cx="55" cy="55" r="18"/>
          <!-- 耳朵 -->
          <path d="M40,48 Q34,22 44,38 Q42,46 45,48"/>
          <path d="M70,48 Q76,22 66,38 Q68,46 65,48"/>
          <!-- 眼睛 (笑眼) -->
          <path d="M46,52 Q49,48 52,52"/>
          <path d="M58,52 Q61,48 64,52"/>
          <!-- 鼻子 -->
          <ellipse cx="55" cy="59" rx="3" ry="2.2" fill="#5c4033"/>
          <!-- 嘴 -->
          <path d="M51,63 Q55,66 59,63"/>
          <!-- 腮红 -->
          <circle cx="43" cy="58" r="3" fill="#ffb3b3" stroke="none" opacity="0.6"/>
          <circle cx="67" cy="58" r="3" fill="#ffb3b3" stroke="none" opacity="0.6"/>
          <!-- 前腿举起 -->
          <path d="M40,105 Q34,100 30,95"/>
          <path d="M48,108 Q42,98 40,88"/>
          <!-- 后腿 -->
          <path d="M62,105 Q66,120 64,128"/>
          <path d="M72,100 Q78,115 80,122"/>
          <!-- 尾巴 -->
          <path d="M78,88 Q92,78 94,68 Q96,60 90,64"/>
        </g>
        <!-- 爱心 -->
        <g transform="translate(28, 68)">
          <path d="M12,5 C12,0 6,-2 3,2 C0,-2 -6,0 -6,5 C-6,12 3,20 3,20 C3,20 12,12 12,5Z" fill="#ff6b6b" stroke="none"/>
        </g>
      </svg>

      <!-- 小狗3: 右下角趴着的小狗 -->
      <svg class="line-dog ld-3" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- 趴着的身体 -->
          <ellipse cx="55" cy="80" rx="28" ry="14"/>
          <!-- 头 -->
          <circle cx="30" cy="70" r="16"/>
          <!-- 耳朵 -->
          <path d="M18,62 Q12,42 22,54 Q20,60 22,62"/>
          <path d="M36,58 Q42,42 38,52 Q40,56 36,58"/>
          <!-- 眼睛 -->
          <circle cx="25" cy="67" r="2" fill="#5c4033"/>
          <circle cx="35" cy="67" r="2" fill="#5c4033"/>
          <!-- 鼻子 -->
          <ellipse cx="30" cy="73" rx="2.8" ry="2" fill="#5c4033"/>
          <!-- 腮红 -->
          <circle cx="21" cy="72" r="2.8" fill="#ffb3b3" stroke="none" opacity="0.5"/>
          <circle cx="39" cy="72" r="2.8" fill="#ffb3b3" stroke="none" opacity="0.5"/>
          <!-- 前爪 -->
          <path d="M36,88 Q34,95 30,96"/>
          <path d="M44,86 Q46,94 44,96"/>
          <!-- 后腿 -->
          <path d="M72,82 Q78,88 80,92"/>
          <path d="M80,78 Q86,84 88,90"/>
          <!-- 尾巴 -->
          <path d="M82,78 Q92,70 90,60 Q88,54 85,60"/>
        </g>
      </svg>

      <!-- 小狗4: 中间偏上飘浮的小狗 -->
      <svg class="line-dog ld-4" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#5c4033" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- 身体 -->
          <ellipse cx="45" cy="70" rx="16" ry="14"/>
          <!-- 头 -->
          <circle cx="45" cy="42" r="15"/>
          <!-- 耳朵 -->
          <path d="M33,34 Q28,18 36,30 Q34,36 36,34"/>
          <path d="M57,34 Q62,18 54,30 Q56,36 54,34"/>
          <!-- 眼睛 -->
          <circle cx="40" cy="39" r="2" fill="#5c4033"/>
          <circle cx="50" cy="39" r="2" fill="#5c4033"/>
          <!-- 鼻子 -->
          <ellipse cx="45" cy="46" rx="2.5" ry="1.8" fill="#5c4033"/>
          <!-- 嘴 -->
          <path d="M42,49 Q45,52 48,49"/>
          <!-- 腮红 -->
          <circle cx="36" cy="46" r="2.5" fill="#ffb3b3" stroke="none" opacity="0.5"/>
          <circle cx="54" cy="46" r="2.5" fill="#ffb3b3" stroke="none" opacity="0.5"/>
          <!-- 腿 -->
          <path d="M36,80 Q32,88 30,90"/>
          <path d="M45,82 Q44,90 42,92"/>
          <path d="M55,80 Q58,88 60,90"/>
          <path d="M62,74 Q68,82 70,86"/>
          <!-- 尾巴 -->
          <path d="M62,66 Q74,60 76,50 Q78,44 74,48"/>
        </g>
        <!-- 小花 -->
        <g transform="translate(62, 35)">
          <circle cx="0" cy="-5" r="3" fill="#ffd1dc" stroke="none"/>
          <circle cx="5" cy="0" r="3" fill="#ffd1dc" stroke="none"/>
          <circle cx="0" cy="5" r="3" fill="#ffd1dc" stroke="none"/>
          <circle cx="-5" cy="0" r="3" fill="#ffd1dc" stroke="none"/>
          <circle cx="0" cy="0" r="2" fill="#ffe066" stroke="none"/>
        </g>
      </svg>
    </div>

    <!-- 我爱你浮现区域 -->
    <div class="love-container" id="love-container">
      <div class="love-text" id="love-text">
        <span class="char char-1">我</span>
        <span class="char char-2">爱</span>
        <span class="char char-3">你</span>
      </div>
      <div class="hearts-area" id="hearts-area"></div>
    </div>

    <!-- 音乐信息提示 -->
    <div class="music-info" id="music-info">
      <div class="music-icon">🎵</div>
      <span>正在播放...</span>
    </div>

    <!-- 音频播放器 -->
    <audio id="bgm" loop preload="auto">
      <source src="audio/bgm.mp3" type="audio/mpeg">
      <source src="audio/bgm.ogg" type="audio/ogg">
    </audio>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
