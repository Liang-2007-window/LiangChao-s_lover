<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F6F0E6">
  <title>找回密码 · 我们的日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <style>html, body { background: #F6F0E6; }</style>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="topbar">
    <a class="link-btn" href="index.html">← 回到小站</a>
    <span class="spacer"></span>
    <a class="link-btn" href="register.html">注册新账号</a>
  </div>

  <main class="shell">
    <section class="card">
      <h1 class="brand">
        <svg viewBox="0 0 32 30" width="18" height="17" aria-hidden="true"><path d="M16,28 C-6,14 4,-4 16,8 C28,-4 38,14 16,28 Z" fill="currentColor"/></svg>
        把密码找回来
      </h1>
      <p class="lede">
        输入账号名，我们会往这个账号绑定的邮箱发一封验证码邮件。<br>
        验证码 + 新密码就能重置，旧密码和所有已登录的设备会一起失效。
      </p>

      <form id="form" novalidate>
        <div class="field">
          <label for="account">账号名</label>
          <input id="account" name="account" type="text" placeholder="注册时用的那个名字"
                 autocomplete="username" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="32" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="code">验证码</label>
          <div class="code-row">
            <input id="code" name="code" type="text" placeholder="6 位数字" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="\d{6}" enterkeyhint="next">
            <button class="btn ghost small" id="send" type="button">发送验证码</button>
          </div>
          <p class="hint">邮件里那 6 位数字，10 分钟内有效。</p>
        </div>

        <div class="field">
          <label for="password">新密码</label>
          <input id="password" name="password" type="password" placeholder="至少 8 位，要有字母和数字"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="64" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="password2">再输一次新密码</label>
          <input id="password2" name="password2" type="password" placeholder="照上面再打一遍"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="64" enterkeyhint="go">
        </div>

        <button class="btn block" id="do-reset" type="submit">重设密码</button>
      </form>

      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </section>

    <p class="foot">
      重置完用新密码登录 · <a href="index.html">去登录</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
