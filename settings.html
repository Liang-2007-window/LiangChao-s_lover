<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F6F0E6">
  <title>账号设置 · 我们的日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <style>html, body { background: #F6F0E6; }</style>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <div class="page-bg" data-page-bg aria-hidden="true"></div>

  <div class="topbar">
    <a class="link-btn" href="diary.html">← 回日记</a>
    <span class="spacer"></span>
    <button class="link-btn" id="logout" type="button">退出登录</button>
  </div>

  <main class="shell">

    <section class="card">
      <h1 class="brand">
        <svg viewBox="0 0 32 30" width="18" height="17" aria-hidden="true"><path d="M16,28 C-6,14 4,-4 16,8 C28,-4 38,14 16,28 Z" fill="currentColor"/></svg>
        账号设置
      </h1>
      <div class="row" style="margin-bottom:10px">
        <span class="muted">账号</span>
        <span class="value" id="who">…</span>
      </div>
      <div class="row">
        <span class="muted">邮箱</span>
        <span class="value" id="mail">…</span>
      </div>
      <p class="hint" style="margin-top:14px">
        邮箱只用来收验证码和找回密码，不会出现在页面或日记里。
      </p>
    </section>

    <!-- 换绑邮箱：验证码发到「现在这个邮箱」，防止别人拿到登录态就改走 -->
    <section class="card">
      <h2 class="brand" style="font-size:17px">换一个邮箱</h2>
      <p class="lede">验证码会发到你<strong>现在</strong>的邮箱，这样即使有人偷登了也改不走。</p>

      <form id="form-mail" novalidate>
        <div class="field">
          <label for="new-email">新邮箱</label>
          <input id="new-email" name="email" type="email" placeholder="以后用这个收信"
                 autocomplete="email" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="254" inputmode="email" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="mail-code">验证码</label>
          <div class="code-row">
            <input id="mail-code" name="code" type="text" placeholder="6 位数字" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="\d{6}" enterkeyhint="go">
            <button class="btn ghost small" id="send-mail-code" type="button">发验证码</button>
          </div>
        </div>

        <button class="btn block" id="save-mail" type="submit">确认换绑</button>
      </form>
      <p class="msg" id="msg-mail" role="status" aria-live="polite"></p>
    </section>

    <!-- 改密码：改完之后其它设备全部掉线 -->
    <section class="card">
      <h2 class="brand" style="font-size:17px">改密码</h2>
      <p class="lede">改完会把你其它设备上的登录状态一起清掉，这台设备继续用。</p>

      <form id="form-pass" novalidate>
        <div class="field">
          <label for="new-pass">新密码</label>
          <input id="new-pass" name="password" type="password" placeholder="至少 8 位，要有字母和数字"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" maxlength="64" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="pass-code">验证码</label>
          <div class="code-row">
            <input id="pass-code" name="code" type="text" placeholder="6 位数字" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="\d{6}" enterkeyhint="go">
            <button class="btn ghost small" id="send-pass-code" type="button">发验证码</button>
          </div>
        </div>

        <button class="btn block" id="save-pass" type="submit">确认改密码</button>
      </form>
      <p class="msg" id="msg-pass" role="status" aria-live="polite"></p>
    </section>

    <p class="foot">账号丢了/邮箱也不能用了，只能找管理员在服务器上处理。</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/page-bg.js"></script>
</body>
</html>
