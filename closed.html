<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>暂时打烊</title>
  <meta name="description" content="网站暂时停止开放。">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FFFBF1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
  <style>
    /* 停业页：整页自成一体，不依赖任何外部样式或字体，双击本地打开也一样。
       配色沿用网站本身的暖纸色 + 珊瑚色。 */
    :root {
      --paper: #FFFBF1;
      --ink: #4A3128;
      --muted: #7E5C4C;
      --faint: #8A6A5C;
      --hair: #E6D5C6;
      --coral: #E8584B;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;          /* 老浏览器 */
      min-height: 100svh;         /* 手机地址栏收起时不跳动 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
      background-color: var(--paper);
      background-image:
        radial-gradient(80% 55% at 50% 0%, #FFE9C9 0%, rgba(255, 251, 241, 0) 62%),
        radial-gradient(70% 50% at 50% 100%, #FDF0E0 0%, rgba(255, 251, 241, 0) 72%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                   'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }

    /* 顶上那团很淡的夕阳 */
    .sun {
      position: fixed;
      left: 50%;
      top: -20vmin;
      width: 72vmin;
      height: 72vmin;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 196, 120, .5) 0%, rgba(255, 196, 120, 0) 68%);
      pointer-events: none;
    }

    .note {
      position: relative;
      width: 100%;
      max-width: 20em;
    }

    /* 一个很淡的爪印，算是这个网站的小记号 */
    .mark {
      display: block;
      width: 30px;
      height: 30px;
      margin: 0 auto 20px;
      color: var(--coral);
      opacity: .32;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 6vw, 32px);
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: .16em;
      text-indent: .16em;        /* 抵消最后一个字后的字距，视觉上居中 */
    }

    .sub {
      margin: 10px 0 0;
      font-size: clamp(14px, 3.4vw, 16px);
      line-height: 1.8;
      letter-spacing: .14em;
      text-indent: .14em;
      color: var(--muted);
    }

    hr {
      width: 26px;
      height: 1px;
      margin: 26px auto;
      border: 0;
      background: var(--hair);
    }

    .hint {
      margin: 0;
      font-size: 13px;
      line-height: 1.9;
      letter-spacing: .06em;
      color: var(--faint);
    }

    @media (max-width: 340px) {
      .note { max-width: 100%; }
      h1 { letter-spacing: .1em; text-indent: .1em; }
    }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>

  <main class="note">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <ellipse cx="20" cy="27" rx="9" ry="7.5" fill="currentColor"/>
      <ellipse cx="7" cy="17" rx="4" ry="5" fill="currentColor" transform="rotate(-20 7 17)"/>
      <ellipse cx="15" cy="9" rx="4" ry="5.2" fill="currentColor" transform="rotate(-6 15 9)"/>
      <ellipse cx="25" cy="9" rx="4" ry="5.2" fill="currentColor" transform="rotate(6 25 9)"/>
      <ellipse cx="33" cy="17" rx="4" ry="5" fill="currentColor" transform="rotate(20 33 17)"/>
    </svg>

    <h1>站长心情不好</h1>
    <p class="sub">网站暂时停止开放</p>

    <hr>

    <p class="hint">过几天再来看看吧</p>
  </main>
</body>
</html>
