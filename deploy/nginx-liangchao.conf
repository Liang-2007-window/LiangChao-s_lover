# ============================================================
#  LiangChao's Lover — Nginx 站点配置（/etc/nginx/sites-available/liangchao）
#  2 核 2G 环境下的取舍：
#   - 静态交给 Nginx（不走 Node），Node 只处理 /api/
#   - gzip 只开文本类，图片/音频/字体不重复压缩
#   - html 不缓存，js/css 1 小时并 must-revalidate，媒体 30 天
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/liangchao/app;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 日记正文上限 100 KB，留一点余量
    client_max_body_size 128k;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ---------- 隐藏不该被下载的东西 ----------
    location ~ /\.            { return 404; }          # .env / .git / .local
    location ~ ^/(server|tests|deploy|docs)/ { return 404; }
    location ~* \.(mjs|md|log|db|db-wal|db-shm)$ { return 404; }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ---------- 静态缓存 ----------
    # 只用 add_header 的 Cache-Control，避免和 expires 各发一条重复头
    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(webp|jpg|jpeg|png|gif|svg|woff2?|mp3|ogg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /diary.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/liangchao.access.log;
    error_log  /var/log/nginx/liangchao.error.log warn;
}