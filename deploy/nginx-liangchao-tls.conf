# ============================================================
#  带 HTTPS 的版本（/etc/nginx/sites-available/liangchao）
#  第一次要用 deploy/issue-cert.sh 拿到证书之后再装这份，否则 nginx -t 会因为找不到证书失败
# ============================================================

# ---------- 80：只做证书校验和跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name selfweb.eu.cc www.selfweb.eu.cc;

    # Let's Encrypt 续期校验（必须在 . 开头那条规则之前，所以用 ^~ 提高优先级）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式服务 ----------
server {
    # nginx 1.18 不认 `http2 on;`，只能用 listen 参数写法
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name selfweb.eu.cc www.selfweb.eu.cc;

    ssl_certificate     /etc/ssl/liangchao/fullchain.pem;
    ssl_certificate_key /etc/ssl/liangchao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;

    root /srv/liangchao/app;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 128k;

    include snippets/liangchao-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    location ~ /\.            { return 404; }
    location ~ ^/(server|tests|deploy|docs)/ { return 404; }
    location ~* \.(mjs|md|log|db|db-wal|db-shm)$ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # css/js 用 no-cache：每次带 ETag 回源校验，没变就 304。站点小，改一次 js
    # 就让人刷到旧文件不划算——上线广场时就踩过一次旧 auth.js 的坑。
    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "no-cache";
        include snippets/liangchao-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(webp|jpg|jpeg|png|gif|svg|woff2?|mp3|ogg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/liangchao-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/liangchao-headers.conf;
    }
    location = /diary.html {
        add_header Cache-Control "no-cache";
        include snippets/liangchao-headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        include snippets/liangchao-headers.conf;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/liangchao.access.log;
    error_log  /var/log/nginx/liangchao.error.log warn;
}